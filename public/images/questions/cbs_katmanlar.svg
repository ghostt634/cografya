<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" className="rounded-xl shadow-lg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>
    <linearGradient id="layerGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="layerGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="16"/>
  <rect x="10" y="10" width="780" height="460" fill="none" stroke="#1e293b" stroke-width="2" rx="12"/>

  <!-- Title -->
  <text x="400" y="42" font-family="'Nunito Sans', sans-serif" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    CBS VEKTÖR VERİ MODELİ VE KATMAN YÖNETİMİ
  </text>
  <text x="400" y="66" font-family="'Nunito Sans', sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Farklı mekânsal özniteliklerin üst üste çakıştırılması (Overlay Analysis)
  </text>

  <!-- Katman 1: Nokta Veri (Hastaneler & Sağlık Tesisleri) -->
  <g transform="translate(180, 80)">
    <polygon points="120,20 380,20 280,75 20,75" fill="url(#layerGrad1)" stroke="#22d3ee" stroke-width="1.8"/>
    <!-- Points -->
    <circle cx="100" cy="48" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <text x="100" y="52" font-family="'Nunito Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>
    <circle cx="210" cy="38" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <text x="210" y="42" font-family="'Nunito Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>
    <circle cx="260" cy="58" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <text x="260" y="62" font-family="'Nunito Sans', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">+</text>
    <!-- Label -->
    <rect x="400" y="32" width="180" height="32" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2"/>
    <text x="412" y="52" font-family="'Nunito Sans', sans-serif" font-size="13" font-weight="700" fill="#22d3ee">1. Nokta Katmanı (Point)</text>
    <text x="412" y="74" font-family="'Nunito Sans', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">Hastaneler, Okullar, Kuyular</text>
    <!-- Connection arrow -->
    <path d="M300 48 L390 48" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1.5"/>
  </g>

  <!-- Katman 2: Çizgi Veri (Ulaşım & Karayolları Ağı) -->
  <g transform="translate(180, 160)">
    <polygon points="120,20 380,20 280,75 20,75" fill="url(#layerGrad2)" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- Lines -->
    <path d="M60 62 Q150 35 240 60 T340 30" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 70 L180 25 L280 40" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 3"/>
    <!-- Label -->
    <rect x="400" y="32" width="180" height="32" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="412" y="52" font-family="'Nunito Sans', sans-serif" font-size="13" font-weight="700" fill="#fbbf24">2. Çizgi Katmanı (Line)</text>
    <text x="412" y="74" font-family="'Nunito Sans', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">Karayolu, Demiryolu, Akarsu</text>
    <path d="M300 48 L390 48" stroke="#f59e0b" stroke-dasharray="3 3" stroke-width="1.5"/>
  </g>

  <!-- Katman 3: Poligon Veri (Mahalle ve Arazi Kullanımı) -->
  <g transform="translate(180, 240)">
    <polygon points="120,20 380,20 280,75 20,75" fill="url(#layerGrad3)" stroke="#10b981" stroke-width="1.8"/>
    <!-- Polygons -->
    <polygon points="80,55 140,30 200,45 150,68" fill="#10b981" fill-opacity="0.6" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="205,42 270,25 320,40 260,65" fill="#059669" fill-opacity="0.6" stroke="#6ee7b7" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="400" y="32" width="180" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="412" y="52" font-family="'Nunito Sans', sans-serif" font-size="13" font-weight="700" fill="#34d399">3. Alan Katmanı (Polygon)</text>
    <text x="412" y="74" font-family="'Nunito Sans', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">Mahalle, Orman, İmar Alanı</text>
    <path d="M300 48 L390 48" stroke="#10b981" stroke-dasharray="3 3" stroke-width="1.5"/>
  </g>

  <!-- Katman 4: Gerçek Dünya Yüzeyi (Raster / Topoğrafya) -->
  <g transform="translate(180, 320)">
    <polygon points="120,20 380,20 280,75 20,75" fill="url(#layerGrad4)" stroke="#60a5fa" stroke-width="2"/>
    <!-- Topography sketch -->
    <path d="M40 70 Q100 40 180 55 T320 35 L340 70 Z" fill="#1e3a8a" fill-opacity="0.5"/>
    <!-- Label -->
    <rect x="400" y="32" width="180" height="32" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="412" y="52" font-family="'Nunito Sans', sans-serif" font-size="13" font-weight="700" fill="#93c5fd">4. Gerçek Dünya (Baz Harita)</text>
    <text x="412" y="74" font-family="'Nunito Sans', sans-serif" font-size="11" font-weight="500" fill="#cbd5e1">Sayısal Yükseklik &amp; Uydu Görüntüsü</text>
    <path d="M300 48 L390 48" stroke="#60a5fa" stroke-dasharray="3 3" stroke-width="1.5"/>
  </g>

  <!-- Sol Dikey Çakıştırma Oku -->
  <g transform="translate(130, 110)">
    <line x1="20" y1="20" x2="20" y2="280" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4"/>
    <polygon points="20,10 14,26 26,26" fill="#38bdf8"/>
    <polygon points="20,290 14,274 26,274" fill="#38bdf8"/>
    <text x="-150" y="8" font-family="'Nunito Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" transform="rotate(-90)" text-anchor="middle">
      ÇAKIŞTIRMA (OVERLAY)
    </text>
  </g>

  <!-- Alt Bilgi Kutusu -->
  <rect x="60" y="420" width="680" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="400" y="445" font-family="'Nunito Sans', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    Coğrafi Bilgi Sistemleri (CBS) • Nokta, Çizgi ve Poligon Vektör Veri Modelleri
  </text>
</svg>
